services:
  - type: web
    name: dailyhair
    runtime: docker
    branch: desenvolvimento
    plan: free
    region: virginia
    autoDeployTrigger: commit
    healthCheckPath: /health.php
    envVars:
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_SSLMODE
        value: require
      - key: SUPABASE_DB_SCHEMA
        value: dailyhair
